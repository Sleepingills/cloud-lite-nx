name: Build Cloud Lite NX

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Unpack source and apply login fix
        run: |
          unzip -q Cloud-Lite-NX-source.zip -d source
          git apply --directory=source/Cloud-Lite-NX fixes/polling-1.1.2.patch
          chmod +x source/Cloud-Lite-NX/scripts/*.sh

      - name: Build Switch application
        run: |
          docker run --rm \
            -e VKPCNX_JOBS=2 \
            -v "$GITHUB_WORKSPACE/source/Cloud-Lite-NX:/work" \
            -w /work \
            devkitpro/devkita64:latest \
            bash -c 'chown -R "$(id -u):$(id -g)" /work && bash scripts/build-cloud-lite-container.sh'

      - name: Save application
        uses: actions/upload-artifact@v4
        with:
          name: Cloud-Lite-NX
          path: source/Cloud-Lite-NX/release/*
          if-no-files-found: error
